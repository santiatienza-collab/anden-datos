name: Datos de trenes

# Descarga los feeds (Renfe, Euskotren, Metro Bilbao, FGC, Consorcio de Transportes de Mallorca), calcula todo y publica
# la API como ficheros estáticos en GitHub Pages. La app de Android lee de ahí.
#
# GitHub NO cumple los cron frecuentes: en repositorios con poca actividad ejecuta una tarea de "*/5" solo una o dos veces
# por hora, o menos. Por eso cada ejecución, al terminar, lanza la siguiente (workflow_dispatch con el token del propio flujo
# sí está permitido). El cron queda como red de seguridad para reanudar la cadena si se rompe.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Solo una ejecución publica a la vez. La siguiente espera a que la actual termine en lugar de cancelarla: así ninguna
# ejecución sale "cancelada" y la comprobación del final de la cadena siempre se completa (hay un tope de 12 min por ejecución).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fecha (clave de caché diaria)
        id: date
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Horarios descargados e índice SQLite: se reutilizan durante el día en lugar de reconstruirlos cada pocos minutos.
      - uses: actions/cache@v4
        with:
          path: backend/data/cache
          key: gtfs-${{ steps.date.outputs.d }}
          restore-keys: gtfs-

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Pruebas
        run: npm test --prefix backend

      - name: Generar la API estática
        env:
          TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
          TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          # Si existe push-test.flag en el repositorio, se envía una notificación de prueba
          FCM_TEST: ${{ hashFiles('push-test.flag') != '' && '1' || '' }}
        run: node backend/src/snapshot.ts site

      # La web (web/) se publica en la raíz, junto a los datos
      - name: Añadir la web
        run: cp -r web/. site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Cadena: espera unos minutos y lanza la siguiente ejecución. Se hace incluso si algo falló arriba (para no romper la cadena),
      # pero no si esta ejecución fue cancelada (así, si la sustituye otra, no se duplican cadenas).
      - name: Lanzar la siguiente ejecución
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 150
          # Si GitHub no logra ARRANCAR la ejecución siguiente (startup_failure, p. ej. durante un incidente de Actions), la cadena
          # se rompería. Se comprueba que la ejecución lanzada ha arrancado y, si no, se reintenta con esperas crecientes.
          for intento in 1 2 3 4 5 6; do
            if gh workflow run data.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"; then
              sleep 25
              estado=$(gh run list --workflow data.yml --repo "$GITHUB_REPOSITORY" --limit 1 --json status,conclusion --jq '.[0].conclusion // .[0].status')
              echo "Intento $intento: estado de la ejecución lanzada = $estado"
              [ "$estado" != "startup_failure" ] && exit 0
            else
              echo "Intento $intento: no se pudo lanzar la ejecución"
            fi
            sleep $((intento * 45))
          done
          echo "::error::No se pudo continuar la cadena; la reanudará el vigilante o el cron"
          exit 1
