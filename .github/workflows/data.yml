name: Datos de trenes

# Descarga los feeds (Renfe, Euskotren, Metro Bilbao, FGC, Consorcio de Transportes de Mallorca), calcula todo y publica
# la API como ficheros estáticos en GitHub Pages. La app de Android lee de ahí.
#
# GitHub NO cumple los cron frecuentes: en repositorios con poca actividad ejecuta una tarea de "*/5" solo una o dos veces
# por hora, o menos. Por eso cada ejecución, al terminar, lanza la siguiente (workflow_dispatch con el token del propio flujo
# sí está permitido). El cron queda como red de seguridad para reanudar la cadena si se rompe.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Si hay varias ejecuciones a la vez (la cadena y el cron), solo importa la más reciente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fecha (clave de caché diaria)
        id: date
        run: echo "d=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Horarios descargados e índice SQLite: se reutilizan durante el día en lugar de reconstruirlos cada pocos minutos.
      - uses: actions/cache@v4
        with:
          path: backend/data/cache
          key: gtfs-${{ steps.date.outputs.d }}
          restore-keys: gtfs-

      - name: Instalar dependencias
        run: npm ci --prefix backend

      - name: Pruebas
        run: npm test --prefix backend

      - name: Generar la API estática
        env:
          TMB_APP_ID: ${{ secrets.TMB_APP_ID }}
          TMB_APP_KEY: ${{ secrets.TMB_APP_KEY }}
        run: node backend/src/snapshot.ts site

      # La web (web/) se publica en la raíz, junto a los datos
      - name: Añadir la web
        run: cp -r web/. site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Cadena: espera unos minutos y lanza la siguiente ejecución. Se hace incluso si algo falló arriba (para no romper la cadena),
      # pero no si esta ejecución fue cancelada (así, si la sustituye otra, no se duplican cadenas).
      - name: Lanzar la siguiente ejecución
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 150
          gh workflow run data.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}"
